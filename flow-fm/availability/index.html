<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Flow FM Inner Season availability for 1:1 client-facing calls." />
  <title>Availability | Flowtel</title>
  <link rel="stylesheet" href="/flow-fm/styles.css?v=0.10.79" />
  <link rel="stylesheet" href="/flow-fm/design-system.css?v=0.10.79" />
  <link rel="stylesheet" href="/flow-fm/availability/styles.css?v=0.10.79" />
  <link rel="stylesheet" href="/flow-fm/platform.css?v=0.10.79" />
</head>
<body class="flowfm-platform-page availability-page">
  <main class="availability-shell">
    <nav class="top-nav" id="topNav" aria-label="Flow FM rooms"></nav>

    <section class="availability-hero flowfm-page-hero">
      <p class="eyebrow">CLIENT-FACING CALLS</p>
      <h1>Availability</h1>
      <p>Choose the weekly rhythm you prefer for client calls in each Inner Season. This is a preference, not a promise that every time will remain open.</p>
    </section>

    <section class="availability-card" id="availabilityExperience" hidden>
      <header class="availability-heading">
        <div>
          <p class="eyebrow">SET YOUR SEASONAL RHYTHM</p>
          <h2>How available do you want to be?</h2>
          <p id="availabilityAnchorCopy"></p>
        </div>
      </header>

      <div id="availabilityOverview" class="availability-overview" aria-live="polite"></div>
      <p id="availabilityMessage" class="availability-message" role="status"></p>

      <section id="availabilityEditor" class="availability-editor" hidden aria-labelledby="availabilityEditorTitle"></section>
    </section>

    <section class="availability-gate" id="availabilityGate" hidden></section>
  </main>
  <script type="module" src="/flow-fm/availability/page.js?v=0.10.79"></script>
</body>
</html>
