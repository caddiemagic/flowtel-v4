<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Your Password · Caddie Magic</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/caddie-magic/styles.css?v=0.7.1"><style>.hidden{display:none!important}.recovery-shell{max-width:680px}</style></head><body><main class="cm-shell recovery-shell"><section class="cm-hero"><p class="cm-eyebrow">CADDIE MAGIC</p><h1>A new key to the Kingdom.</h1></section><section class="cm-card"><div id="requestPanel"><h2>Forgot your password?</h2><p class="cm-muted">Enter the email you use for your Player Profile.</p><form id="requestForm" class="cm-form"><label>Email<input id="resetEmail" type="email" autocomplete="email" required></label><button class="cm-button" id="requestButton">Email My Reset Link</button></form></div><div id="passwordPanel" class="hidden"><h2>Choose your new password.</h2><form id="passwordForm" class="cm-form"><label>New Password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm New Password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="cm-button" id="saveButton">Save My New Password</button></form></div><p id="recoveryMessage" class="cm-message" role="status"></p><a class="cm-button secondary" href="/caddie-magic/">Back to Player Login</a></section></main><script type="module" src="./app.js?v=1"></script></body></html>
