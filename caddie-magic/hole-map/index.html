<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hole Score Wheel · Caddie Magic Kingdom</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/caddie-magic/styles.css?v=0.8.0"><link rel="stylesheet" href="/shared/kingdom-ui.css?v=0.8.0"></head><body><main class="cm-shell kingdom-shell"><section class="cm-hero "><p class="cm-eyebrow">CADDIE MAGIC KINGDOM</p><h1>Hole Score Wheel</h1><p class="cm-lead">Your numbers, held in the moon.</p></section><nav class="kingdom-nav"><a class="cm-button secondary" href="/caddie-magic/">Return to the Locker Room</a></nav><p id="pageMessage" class="kingdom-status" role="status">Opening your room…</p><section class="cm-card hidden" id="room"><div class="kingdom-tools"><label>Round Length<select id="length"><option value="18">18 holes</option><option value="9">9 holes</option></select></label><label>Moon Phase<select id="phase"><option value="all">All moon phases</option></select></label><label>Round<select id="roundChoice"></select></label></div><p id="roundMoon" class="cm-muted"></p><div id="wheel"></div><div id="roundEditor" class="hidden"><h2>Continue Your Round</h2><form id="holeEditForm" class="cm-form"><div id="holeEditFields" class="hole-fields"></div><button class="cm-button">Save Hole Scores</button></form></div><div id="roundScores"></div><p class="cm-muted">No par, course comparison, or judgment. Blank positions are unplayed holes. Earlier total-only rounds remain in your original Score Map.</p></section></main><script type="module" src="./app.js?v=0.8.0"></script></body></html>
